<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iMemo - 不具合修正版</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --list-bg: #ffffff;
      --accent-color: #eab308;
      --text-color: #000000;
      --border-color: #c6c6c8;
      --sidebar-width: 260px;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    #sidebar-header {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    #sidebar-title {
      font-size: 17px;
      font-weight: 600;
    }

    #new-memo-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 28px;
      font-weight: 300;
      cursor: pointer;
      padding: 0 5px;
      line-height: 1;
    }

    #memo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex-grow: 1;
    }

    #memo-list li {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #memo-list li:hover {
      background-color: #e5e5ea;
    }

    #memo-list li.selected {
      background-color: #d1d1d6;
    }

    #editor {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--list-bg);
    }

    #editor-header {
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      height: 35px;
    }

    #save-status {
      font-size: 13px;
      color: #8e8e93;
    }

    #memo-textarea {
      flex-grow: 1;
      padding: 20px;
      border: none;
      resize: none;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
    }

    @media (max-width: 600px) {
      :root {
        --sidebar-width: 100%;
      }
      body {
        position: relative;
      }
      #editor {
        position: absolute;
        top: 0;
        left: 100%;
        width: 100%;
        height: 100%;
        transition: left 0.3s;
        z-index: 10;
      }
      body.showing-editor #editor {
        left: 0;
      }
      
      #back-btn {
        display: block;
        background: none;
        border: none;
        color: var(--accent-color);
        font-size: 17px;
        cursor: pointer;
      }
    }
    
    @media (min-width: 601px) {
      #back-btn { display: none; }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-title">メモ</div>
      <button id="new-memo-btn" onclick="createNewMemo()" title="新規メモ">+</button>
    </div>
    <ul id="memo-list"></ul>
  </div>

  <div id="editor">
    <div id="editor-header">
      <button id="back-btn" onclick="hideEditor()">◀ メモ</button>
      <div id="save-status"></div>
    </div>
    <textarea id="memo-textarea" placeholder="メモを入力..." oninput="handleInput()"></textarea>
  </div>

  <script>
    const SUPABASE_URL = "https://lgolwacrtoabfnwpzfvq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxnb2x3YWNydG9hYmZud3B6ZnZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMzE3NzIsImV4cCI6MjEwMTcwNzc3Mn0.nd15mPFy49ttqhYC1ycFtXfPXwZRymyFWoqBef0IHSU";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentMemoId = null;
    let memosData = [];
    let saveTimeout = null;
    let isSaving = false;

    window.onload = loadMemos;

    async function loadMemos() {
      const { data, error } = await supabaseClient
        .from('memos')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error("読み込み失敗:", error.message);
        return;
      }
      
      memosData = data;
      renderMemoList();
    }

    function renderMemoList() {
      const list = document.getElementById('memo-list');
      list.innerHTML = '';

      memosData.forEach(memo => {
        const li = document.createElement('li');
        const lines = memo.text.split('\n');
        li.textContent = lines[0] || "新規メモ"; 
        
        li.onclick = () => selectMemo(memo.id);
        
        if (memo.id === currentMemoId) {
          li.classList.add('selected');
        }
        
        list.appendChild(li);
      });
    }

    function selectMemo(id) {
      currentMemoId = id;
      const memo = memosData.find(m => m.id === id);
      const textarea = document.getElementById('memo-textarea');

      if (memo) {
        textarea.value = memo.text;
        document.getElementById('save-status').textContent = '保存済み';
        textarea.focus();
        
        renderMemoList();
        showEditor();
      }
    }

    // ★【修正】新規メモ作成（＋ボタンを押した時）
    function createNewMemo() {
      // 1. 動いている保存タイマーを強制ストップ
      clearTimeout(saveTimeout);
      isSaving = false;

      // 2. 現在選択中のメモを解除して入力欄をクリア
      currentMemoId = null;
      const textarea = document.getElementById('memo-textarea');
      textarea.value = '';
      document.getElementById('save-status').textContent = '新規メモ';
      
      // 3. 一覧の選択表示を解除＆画面切り替え
      renderMemoList();
      showEditor();

      // 4. 入力エリアにカーソルをセット
      setTimeout(() => {
        textarea.focus();
      }, 50);
    }

    function handleInput() {
      const text = document.getElementById('memo-textarea').value;
      
      if (currentMemoId) {
        const memo = memosData.find(m => m.id === currentMemoId);
        if (memo) {
          memo.text = text;
          renderMemoList();
        }
      }

      document.getElementById('save-status').textContent = '保存中...';

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        autoSave();
      }, 300);
    }

    // ★【修正】エラーが起きてもアプリが固まらないように改善
    async function autoSave() {
      const text = document.getElementById('memo-textarea').value;

      if (!text && !currentMemoId) {
        document.getElementById('save-status').textContent = '';
        return;
      }

      if (isSaving) return;
      isSaving = true;

      try {
        if (currentMemoId) {
          // 【更新】
          const { error } = await supabaseClient
            .from('memos')
            .update({ text: text })
            .eq('id', currentMemoId);

          if (!error) {
            document.getElementById('save-status').textContent = '保存済み';
          }
        } else {
          // 【新規作成】
          const { data, error } = await supabaseClient
            .from('memos')
            .insert([{ text: text }])
            .select();

          if (!error && data && data.length > 0) {
            currentMemoId = data[0].id;
            memosData.unshift(data[0]);
            renderMemoList();
            document.getElementById('save-status').textContent = '保存済み';
          }
        }
      } catch (e) {
        console.error("保存エラー:", e);
      } finally {
        isSaving = false; // 必ず保存ロックを解除
      }
    }

    function showEditor() {
      if (window.innerWidth <= 600) {
        document.body.classList.add('showing-editor');
      }
    }

    function hideEditor() {
      document.body.classList.remove('showing-editor');
      currentMemoId = null;
      renderMemoList();
    }
  </script>
</body>
</html>
