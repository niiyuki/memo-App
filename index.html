<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iMemo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --list-bg: #ffffff;
      --accent-color: #eab308;
      --text-color: #000000;
      --border-color: #c6c6c8;
      --sidebar-width: 260px;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    #sidebar-header {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    #sidebar-title {
      font-size: 17px;
      font-weight: 600;
    }

    #new-memo-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 28px;
      font-weight: 300;
      cursor: pointer;
      padding: 0 5px;
      line-height: 1;
    }

    #memo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex-grow: 1;
    }

    /* メモ項目（フレックス配置にして右側に削除ボタンを置く） */
    #memo-list li {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      cursor: grab;
      user-select: none;
      background-color: var(--bg-color);
      transition: background-color 0.2s, opacity 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #memo-list li:active {
      cursor: grabbing;
    }

    #memo-list li:hover {
      background-color: #e5e5ea;
    }

    #memo-list li.selected {
      background-color: #d1d1d6;
    }

    /* メモのタイトルテキスト */
    .memo-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
      margin-right: 8px;
    }

    /* 一覧の中の削除ボタン */
    .list-delete-btn {
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      opacity: 0.6;
      transition: opacity 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .list-delete-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    #memo-list li.dragging {
      opacity: 0.4;
      background-color: #e5e5ea;
    }

    #editor {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--list-bg);
    }

    #editor-header {
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      height: 35px;
    }

    #save-status {
      font-size: 13px;
      color: #8e8e93;
    }

    #memo-textarea {
      flex-grow: 1;
      padding: 20px;
      border: none;
      resize: none;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
    }

    @media (max-width: 600px) {
      :root {
        --sidebar-width: 100%;
      }
      body {
        position: relative;
      }
      #editor {
        position: absolute;
        top: 0;
        left: 100%;
        width: 100%;
        height: 100%;
        transition: left 0.3s;
        z-index: 10;
      }
      body.showing-editor #editor {
        left: 0;
      }
      
      #back-btn {
        display: block;
        background: none;
        border: none;
        color: var(--accent-color);
        font-size: 17px;
        cursor: pointer;
      }
    }
    
    @media (min-width: 601px) {
      #back-btn { display: none; }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-title">メモ</div>
      <button id="new-memo-btn" onclick="createNewMemo()" title="新規メモ">+</button>
    </div>
    <ul id="memo-list"></ul>
  </div>

  <div id="editor">
    <div id="editor-header">
      <button id="back-btn" onclick="hideEditor()">◀ メモ</button>
      <div id="save-status"></div>
    </div>
    <textarea id="memo-textarea" placeholder="メモを入力..." oninput="handleInput()"></textarea>
  </div>

  <script>
    const SUPABASE_URL = "https://lgolwacrtoabfnwpzfvq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxnb2x3YWNydG9hYmZud3B6ZnZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMzE3NzIsImV4cCI6MjEwMTcwNzc3Mn0.nd15mPFy49ttqhYC1ycFtXfPXwZRymyFWoqBef0IHSU";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentMemoId = null;
    let memosData = [];
    let saveTimeout = null;
    let isSaving = false;
    let draggedItem = null;

    window.onload = loadMemos;

    // 1. メモ一覧の読み込み
    async function loadMemos() {
      document.getElementById('save-status').textContent = '読み込み中...';
      
      const { data, error } = await supabaseClient
        .from('memos')
        .select('*')
        .order('position', { ascending: false });

      if (error) {
        alert("接続エラー: " + error.message);
        document.getElementById('save-status').textContent = '接続失敗';
        return;
      }
      
      memosData = data || [];
      renderMemoList();
      document.getElementById('save-status').textContent = '';
    }

    // 2. メモ一覧の描画（タイトル＋右側に削除ボタン）
    function renderMemoList() {
      const list = document.getElementById('memo-list');
      list.innerHTML = '';

      memosData.forEach((memo, index) => {
        const li = document.createElement('li');
        li.draggable = true;
        li.dataset.id = memo.id;
        li.dataset.index = index;

        // メモタイトル部分
        const titleSpan = document.createElement('span');
        titleSpan.className = 'memo-title';
        const lines = memo.text.split('\n');
        titleSpan.textContent = lines[0] || "新規メモ";
        titleSpan.onclick = () => selectMemo(memo.id);

        // 削除ボタン部分（🗑️）
        const delBtn = document.createElement('button');
        delBtn.className = 'list-delete-btn';
        delBtn.innerHTML = '🗑️';
        delBtn.title = 'メモを削除';
        delBtn.onclick = (e) => {
          e.stopPropagation(); // メモの選択イベントが発生するのを防ぐ
          deleteMemoById(memo.id);
        };

        li.appendChild(titleSpan);
        li.appendChild(delBtn);

        if (memo.id === currentMemoId) {
          li.classList.add('selected');
        }

        // --- ドラッグ＆ドロップ処理 ---
        li.addEventListener('dragstart', (e) => {
          draggedItem = li;
          li.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        li.addEventListener('dragend', () => {
          li.classList.remove('dragging');
          draggedItem = null;
          updatePositionsInDatabase();
        });

        li.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          const targetItem = e.target.closest('li');
          if (targetItem && targetItem !== draggedItem) {
            const listArr = Array.from(list.children);
            const draggedIdx = listArr.indexOf(draggedItem);
            const targetIdx = listArr.indexOf(targetItem);

            if (draggedIdx < targetIdx) {
              list.insertBefore(draggedItem, targetItem.nextSibling);
            } else {
              list.insertBefore(draggedItem, targetItem);
            }
          }
        });

        list.appendChild(li);
      });
    }

    // 3. ドラッグ後の並び順を保存
    async function updatePositionsInDatabase() {
      document.getElementById('save-status').textContent = '順序保存中...';
      const listItems = document.querySelectorAll('#memo-list li');
      const totalCount = listItems.length;

      const updates = [];
      const newMemosData = [];

      listItems.forEach((li, index) => {
        const id = parseInt(li.dataset.id);
        const newPosition = totalCount - index;

        const memo = memosData.find(m => m.id === id);
        if (memo) {
          memo.position = newPosition;
          newMemosData.push(memo);
        }

        updates.push(
          supabaseClient
            .from('memos')
            .update({ position: newPosition })
            .eq('id', id)
        );
      });

      memosData = newMemosData;

      await Promise.all(updates);
      document.getElementById('save-status').textContent = '順序保存完了';
      setTimeout(() => {
        if (document.getElementById('save-status').textContent === '順序保存完了') {
          document.getElementById('save-status').textContent = '保存済み';
        }
      }, 1000);
    }

    // 4. メモを選択
    function selectMemo(id) {
      currentMemoId = id;
      const memo = memosData.find(m => m.id === id);
      const textarea = document.getElementById('memo-textarea');

      if (memo) {
        textarea.value = memo.text;
        document.getElementById('save-status').textContent = '保存済み';
        textarea.focus();
        
        renderMemoList();
        showEditor();
      }
    }

    // 5. 新規メモ作成
    function createNewMemo() {
      clearTimeout(saveTimeout);
      isSaving = false;

      currentMemoId = null;
      const textarea = document.getElementById('memo-textarea');
      textarea.value = '';
      document.getElementById('save-status').textContent = '新規メモ';
      
      renderMemoList();
      showEditor();

      setTimeout(() => {
        textarea.focus();
      }, 50);
    }

    // 6. 指定したIDのメモを削除する処理
    async function deleteMemoById(id) {
      if (!confirm("このメモを削除してもよろしいですか？")) {
        return;
      }

      document.getElementById('save-status').textContent = '削除中...';

      const { error } = await supabaseClient
        .from('memos')
        .delete()
        .eq('id', id);

      if (error) {
        alert("削除に失敗しました: " + error.message);
        document.getElementById('save-status').textContent = 'エラー';
        return;
      }

      // データから削除
      memosData = memosData.filter(m => m.id !== id);

      // 現在開いていたメモを削除した場合は編集欄をリセット
      if (currentMemoId === id) {
        createNewMemo();
        hideEditor();
      } else {
        renderMemoList();
        document.getElementById('save-status').textContent = '削除完了';
      }
    }

    // 7. 文字入力時の処理
    function handleInput() {
      const text = document.getElementById('memo-textarea').value;
      
      if (currentMemoId) {
        const memo = memosData.find(m => m.id === currentMemoId);
        if (memo) {
          memo.text = text;
          renderMemoList();
        }
      }

      document.getElementById('save-status').textContent = '保存中...';

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        autoSave();
      }, 300);
    }

    // 8. 自動保存
    async function autoSave() {
      const text = document.getElementById('memo-textarea').value;

      if (!text && !currentMemoId) {
        document.getElementById('save-status').textContent = '';
        return;
      }

      if (isSaving) return;
      isSaving = true;

      try {
        if (currentMemoId) {
          // 【更新】
          const { error } = await supabaseClient
            .from('memos')
            .update({ text: text })
            .eq('id', currentMemoId);

          if (!error) {
            document.getElementById('save-status').textContent = '保存済み';
          }
        } else {
          // 【新規登録】
          const maxPosition = memosData.length > 0 ? Math.max(...memosData.map(m => m.position || 0)) + 1 : 1;

          const { data, error } = await supabaseClient
            .from('memos')
            .insert([{ text: text, position: maxPosition }])
            .select();

          if (!error && data && data.length > 0) {
            currentMemoId = data[0].id;
            memosData.unshift(data[0]);
            renderMemoList();
            document.getElementById('save-status').textContent = '保存済み';
          }
        }
      } catch (e) {
        console.error("保存エラー:", e);
      } finally {
        isSaving = false;
      }
    }

    function showEditor() {
      if (window.innerWidth <= 600) {
        document.body.classList.add('showing-editor');
      }
    }

    function hideEditor() {
      document.body.classList.remove('showing-editor');
      currentMemoId = null;
      renderMemoList();
    }
  </script>
</body>
</html>
