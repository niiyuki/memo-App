<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイメモアプリ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 0 20px; }
    h1 { color: #333; }
    input { width: 70%; padding: 10px; font-size: 16px; }
    button { padding: 10px 15px; font-size: 16px; background-color: #3ecf8e; color: white; border: none; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin-top: 20px; }
    li { background: #f4f4f4; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>📝 マイメモアプリ</h1>
  <input type="text" id="memoInput" placeholder="メモを入力...">
  <button onclick="addMemo()">保存</button>

  <ul id="memoList"></ul>

  <script>
    // ※Vercelの設定画面で読み込ませる安全な設定です
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 画面が開いたらメモ一覧を読み込む
    window.onload = loadMemos;

    async function loadMemos() {
      const { data, error } = await supabaseClient.from('memos').select('*').order('id', { ascending: false });
      if (error) return alert("読み込み失敗: " + error.message);
      
      const list = document.getElementById('memoList');
      list.innerHTML = '';
      data.forEach(memo => {
        const li = document.createElement('li');
        li.textContent = memo.text;
        list.appendChild(li);
      });
    }

    async function addMemo() {
      const input = document.getElementById('memoInput');
      if (!input.value) return;

      const { error } = await supabaseClient.from('memos').insert([{ text: input.value }]);
      if (error) return alert("保存失敗: " + error.message);

      input.value = '';
      loadMemos(); // 再読み込み
    }
  </script>
</body>
</html>
