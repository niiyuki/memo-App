<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iMemo - 自動保存対応</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 全体の設定 */
    :root {
      --bg-color: #f2f2f7; /* iPhoneの薄灰色 */
      --list-bg: #ffffff;
      --accent-color: #eab308; /* メモ帳の黄色 */
      --text-color: #000000;
      --border-color: #c6c6c8;
      --sidebar-width: 260px;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    /* 左側：メモ一覧（サイドバー） */
    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    #sidebar-header {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    #sidebar-title {
      font-size: 17px;
      font-weight: 600;
    }

    #new-memo-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
    }

    #memo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex-grow: 1;
    }

    #memo-list li {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #memo-list li:hover {
      background-color: #e5e5ea;
    }

    #memo-list li.selected {
      background-color: #d1d1d6;
    }

    /* 右側：メモ詳細（エディタ） */
    #editor {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--list-bg);
    }

    #editor-header {
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      height: 35px;
    }

    /* 保存状態を表示するラベル */
    #save-status {
      font-size: 13px;
      color: #8e8e93;
    }

    #memo-textarea {
      flex-grow: 1;
      padding: 20px;
      border: none;
      resize: none;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
    }

    /* スマホ対応（画面が狭い時） */
    @media (max-width: 600px) {
      :root {
        --sidebar-width: 100%;
      }
      body {
        position: relative;
      }
      #editor {
        position: absolute;
        top: 0;
        left: 100%;
        width: 100%;
        height: 100%;
        transition: left 0.3s;
        z-index: 10;
      }
      body.showing-editor #editor {
        left: 0;
      }
      
      #back-btn {
        display: block;
        background: none;
        border: none;
        color: var(--accent-color);
        font-size: 17px;
        cursor: pointer;
      }
    }
    
    @media (min-width: 601px) {
      #back-btn { display: none; }
    }

  </style>
</head>
<body>

  <!-- 左側：メモ一覧 -->
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-title">メモ</div>
      <button id="new-memo-btn" onclick="createNewMemo()">📝</button>
    </div>
    <ul id="memo-list"></ul>
  </div>

  <!-- 右側：メモ詳細 -->
  <div id="editor">
    <div id="editor-header">
      <button id="back-btn" onclick="hideEditor()">◀ メモ</button>
      <div id="save-status"></div>
    </div>
    <!-- 文字を入力するたびに oninput が動いて自動保存します -->
    <textarea id="memo-textarea" placeholder="メモを入力..." oninput="handleInput()"></textarea>
  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentMemoId = null;
    let memosData = [];
    let saveTimeout = null; // 自動保存のタイマー

    window.onload = loadMemos;

    // 1. メモ一覧を読み込む
    async function loadMemos() {
      const { data, error } = await supabaseClient
        .from('memos')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error("読み込み失敗:", error.message);
        return;
      }
      
      memosData = data;
      renderMemoList();
    }

    // 2. メモ一覧の描画
    function renderMemoList() {
      const list = document.getElementById('memo-list');
      list.innerHTML = '';

      memosData.forEach(memo => {
        const li = document.createElement('li');
        const lines = memo.text.split('\n');
        li.textContent = lines[0] || "新規メモ"; 
        
        li.onclick = () => selectMemo(memo.id);
        
        if (memo.id === currentMemoId) {
          li.classList.add('selected');
        }
        
        list.appendChild(li);
      });
    }

    // 3. メモを選択
    function selectMemo(id) {
      currentMemoId = id;
      const memo = memosData.find(m => m.id === id);
      const textarea = document.getElementById('memo-textarea');

      if (memo) {
        textarea.value = memo.text;
        document.getElementById('save-status').textContent = '保存済み';
        textarea.focus();
        
        renderMemoList();
        showEditor();
      }
    }

    // 4. 新規メモ作成
    function createNewMemo() {
      currentMemoId = null;
      document.getElementById('memo-textarea').value = '';
      document.getElementById('save-status').textContent = '';
      document.getElementById('memo-textarea').focus();
      renderMemoList();
      showEditor();
    }

    // 5. 文字入力時の処理（自動保存のトリガー）
    function handleInput() {
      document.getElementById('save-status').textContent = '保存中...';

      // 連続で入力している間は保存を待ち、入力が少し止まったら（0.5秒後）自動保存する
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        autoSave();
      }, 500);
    }

    // 6. 自動保存を実行
    async function autoSave() {
      const text = document.getElementById('memo-textarea').value;

      // 文字が空で、まだ作成されていない場合は保存しない
      if (!text && !currentMemoId) {
        document.getElementById('save-status').textContent = '';
        return;
      }

      if (currentMemoId) {
        // 【更新】既存のメモを上書き保存
        const { error } = await supabaseClient
          .from('memos')
          .update({ text: text })
          .eq('id', currentMemoId);

        if (!error) {
          // メモ一覧の表示テキストを更新
          const memo = memosData.find(m => m.id === currentMemoId);
          if (memo) memo.text = text;
          renderMemoList();
          document.getElementById('save-status').textContent = '保存済み';
        }
      } else {
        // 【新規作成】初回入力時に自動で新規登録
        const { data, error } = await supabaseClient
          .from('memos')
          .insert([{ text: text }])
          .select();

        if (!error && data && data.length > 0) {
          currentMemoId = data[0].id; // 発行されたIDを保持
          memosData.unshift(data[0]); // 一覧の一番上に追加
          renderMemoList();
          document.getElementById('save-status').textContent = '保存済み';
        }
      }
    }

    // スマホ用画面切り替え
    function showEditor() {
      if (window.innerWidth <= 600) {
        document.body.classList.add('showing-editor');
      }
    }

    function hideEditor() {
      document.body.classList.remove('showing-editor');
      currentMemoId = null;
      renderMemoList();
    }
  </script>
</body>
</html>
